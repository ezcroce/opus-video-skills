<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Underground · pixel reel</title>
<style>
  html, body { margin: 0; background: #120a08; color: #e8e0d0; font: 13px ui-monospace, monospace; }
  main { padding: 12px; display: grid; gap: 8px; justify-items: center; }
  /* the canvas is laid out at its full pixel size; the page may scroll */
  #out { width: 1080px; height: 1920px; background: #000; image-rendering: pixelated; flex: none; }
  .bar { display: flex; gap: 10px; align-items: center; width: 1080px; }
  #scrub { flex: 1; } #tt { font-variant-numeric: tabular-nums; min-width: 160px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar">
    <input id="scrub" type="range" min="0" max="23" step="0.0333" value="0">
    <span id="tt">loading…</span>
  </div>
</main>
<script src="src/cues.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
